name: unpack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          sudo apt-get install -y -qq unzip
          unzip -o "BGMI 4.7 X64 @JOIN_ALL_SRC.zip" -d extracted
          rm "BGMI 4.7 X64 @JOIN_ALL_SRC.zip"
          shopt -s dotglob
          mv extracted/* .
          rmdir extracted

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "unpack source"
          git push
