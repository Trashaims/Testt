name: build-sign

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'build.log'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          echo "== build start ==" > build.log
          sudo apt-get update -qq
          sudo apt-get install -y -qq zipalign apksigner unzip wget 2>&1 | tee -a build.log

      - name: Get apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /tmp/apktool.jar 2>&1 | tee -a build.log
          ls -l /tmp/apktool.jar 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Get framework
        run: |
          wget -q https://dl.google.com/android/repository/platform-35_r01.zip -O /tmp/p35.zip 2>&1 | tee -a build.log
          unzip -o -j /tmp/p35.zip 'android-35/android.jar' -d /tmp 2>&1 | tee -a build.log
          mkdir -p /tmp/fw
          cp /tmp/android.jar /tmp/fw/1.apk
          exit ${PIPESTATUS[0]}

      - name: Restore pristine bundle
        run: |
          git checkout 12efa3bfd8b8a42d4dce517ac3242172dda52483 -- decoded/assets/index.android.bundle 2>&1 | tee -a build.log || echo "restore failed, using working copy" | tee -a build.log

      - name: Manifest perms
        run: |
          python3 - <<'EOF'
          p = "decoded/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          if "MANAGE_EXTERNAL_STORAGE" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <application', 1)
          if "requestLegacyExternalStorage" not in s:
              s = s.replace("<application", '<application android:requestLegacyExternalStorage="true"', 1)
          open(p, "w", encoding="utf-8").write(s)
          print("manifest patched")
          EOF

      - name: Build container
        run: |
          java -jar /tmp/apktool.jar b decoded -p /tmp/fw -o unsigned.apk 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Patch bundle
        continue-on-error: true
        run: |
          python3 patch_bundle.py decoded/assets/index.android.bundle 2>&1 | tee -a build.log

      - name: Write shim
        run: |
          mkdir -p shim/smali/com/pubg/krmobile
          cat > shim/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.pubg.krmobile">
            <uses-sdk android:minSdkVersion="21" android:targetSdkVersion="34"/>
            <application android:label="BGMI">
              <activity android:name=".Main" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > shim/apktool.yml <<'EOF'
          version: 2.10.0
          apkFileName: shim.apk
          isFrameworkApk: false
          usesFramework:
            ids:
            - 1
          sdkInfo:
            minSdkVersion: '21'
            targetSdkVersion: '34'
          packageInfo:
            forcedPackageId: '127'
          versionInfo:
            versionCode: '4'
            versionName: '1.3'
          EOF
          cat > shim/smali/com/pubg/krmobile/Main.smali <<'EOF'
          .class public Lcom/pubg/krmobile/Main;
          .super Landroid/app/Activity;
          .source "Main.java"

          .method public constructor <init>()V
              .locals 0
              invoke-direct {p0}, Landroid/app/Activity;-><init>()V
              return-void
          .end method

          .method protected onCreate(Landroid/os/Bundle;)V
              .locals 4
              invoke-super {p0, p1}, Landroid/app/Activity;->onCreate(Landroid/os/Bundle;)V

              :try_start
              invoke-virtual {p0}, Landroid/app/Activity;->getPackageManager()Landroid/content/pm/PackageManager;
              move-result-object v0
              const-string v1, "com.pubg.imobile"
              invoke-virtual {v0, v1}, Landroid/content/pm/PackageManager;->getLaunchIntentForPackage(Ljava/lang/String;)Landroid/content/Intent;
              move-result-object v2
              if-nez v2, :try_end
              const/high16 v3, 0x10000000
              invoke-virtual {v2, v3}, Landroid/content/Intent;->addFlags(I)Landroid/content/Intent;
              invoke-virtual {p0, v2}, Landroid/app/Activity;->startActivity(Landroid/content/Intent;)V
              :try_end
              goto :done
              .catch Ljava/lang/Exception; {:try_start .. :try_end} :catch

              :catch
              move-exception v0

              :done
              invoke-virtual {p0}, Landroid/app/Activity;->finish()V
              return-void
          .end method
          EOF

      - name: Build shim
        run: |
          java -jar /tmp/apktool.jar b shim -p /tmp/fw -o shim-u.apk 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Align and sign
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          P="${KS_PASS:-venice123}"
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias bgmi \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$P" -keypass "$P" -dname "CN=bgmi" 2>&1 | tee -a build.log
          fi
          zipalign -p -f 4 unsigned.apk aligned.apk 2>&1 | tee -a build.log
          apksigner sign --ks keystore.jks --ks-key-alias bgmi --ks-pass "pass:$P" --key-pass "pass:$P" --out signed.apk aligned.apk 2>&1 | tee -a build.log
          zipalign -p -f 4 shim-u.apk shim-al.apk 2>&1 | tee -a build.log
          apksigner sign --ks keystore.jks --ks-key-alias bgmi --ks-pass "pass:$P" --key-pass "pass:$P" --out shim.apk shim-al.apk 2>&1 | tee -a build.log
          unzip -l shim.apk 2>&1 | tee -a build.log
          apksigner verify --verbose --print-certs shim.apk 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Commit
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@local"
          git add -A
          git commit -m "build $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "push failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: |
            signed.apk
            shim.apk
            build.log
