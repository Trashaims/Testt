name: build-sign

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'build.log'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          echo "== build start ==" > build.log
          sudo apt-get update -qq
          sudo apt-get install -y -qq zipalign apksigner unzip wget 2>&1 | tee -a build.log

      - name: Get apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /tmp/apktool.jar 2>&1 | tee -a build.log
          ls -l /tmp/apktool.jar 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Get framework
        run: |
          wget -q https://dl.google.com/android/repository/platform-35_r01.zip -O /tmp/p35.zip 2>&1 | tee -a build.log
          unzip -o -j /tmp/p35.zip 'android-35/android.jar' -d /tmp 2>&1 | tee -a build.log
          mkdir -p /tmp/fw
          cp /tmp/android.jar /tmp/fw/1.apk
          ls -l /tmp/fw 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Build
        run: |
          java -jar /tmp/apktool.jar b decoded -p /tmp/fw -o unsigned.apk 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Patch bundle
        run: |
          python3 patch_bundle.py decoded/assets/index.android.bundle 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Align
        run: |
          zipalign -p -f 4 unsigned.apk aligned.apk 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Sign
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          P="${KS_PASS:-venice123}"
          if [ ! -f keystore.jks ]; then
            keytool -genkeypair -v -keystore keystore.jks -alias bgmi \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$P" -keypass "$P" -dname "CN=bgmi" 2>&1 | tee -a build.log
          fi
          apksigner sign --ks keystore.jks --ks-key-alias bgmi \
            --ks-pass "pass:$P" --key-pass "pass:$P" \
            --out signed.apk aligned.apk 2>&1 | tee -a build.log
          exit ${PIPESTATUS[0]}

      - name: Commit
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@local"
          git add -A
          git commit -m "build $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push || echo "push failed"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: output
          path: |
            signed.apk
            build.log
