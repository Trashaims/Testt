name: build-sign

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get apktool
        run: |
          curl -sSL -o apktool.jar curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          java -jar apktool.jar --version 2>&1 | tee -a build.log

      - name: Drop unknown dir
        run: rm -rf decoded/unknown

      - name: Build
        run: |
          set -o pipefail
          java -jar apktool.jar b decoded -o unsigned.apk 2>&1 | tee -a build.log

      - name: Commit log
        if: always()
        run: |
          git config user.name "gha"
          git config user.email "gha@users.noreply.github.com"
          git add -f build.log
          git commit -m "build log" || true
          git push || true

      - name: Align
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 unsigned.apk aligned.apk

      - name: Sign
        run: |
          keytool -genkeypair -keystore ks.jks -storepass android -keypass android \
            -alias k -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=venus"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks ks.jks --ks-pass pass:android --key-pass pass:android \
            --out venus-bgmi-signed.apk aligned.apk

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venus-bgmi
          path: venus-bgmi-signed.apk
