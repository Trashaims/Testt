name: build-sign

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool
          {
            echo "=== apktool ==="; apktool --version
            echo "=== java ==="; java -version 2>&1
            echo "=== decoded ==="; ls -la decoded
            echo "=== decoded/res/values ==="; ls -la decoded/res/values
          } 2>&1 | tee -a build.log

      - name: Drop unknown dir
        run: rm -rf decoded/unknown

      - name: Build
        run: |
          set -o pipefail
          apktool b decoded -o unsigned.apk 2>&1 | tee -a build.log

      - name: Commit log
        if: always()
        run: |
          git config user.name "gha"
          git config user.email "gha@users.noreply.github.com"
          git add -f build.log
          git commit -m "build log" || true
          git push || true

      - name: Align
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 unsigned.apk aligned.apk

      - name: Sign
        run: |
          keytool -genkeypair -keystore ks.jks -storepass android -keypass android \
            -alias k -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=venus"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks ks.jks --ks-pass pass:android --key-pass pass:android \
            --out venus-bgmi-signed.apk aligned.apk

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: venus-bgmi
          path: venus-bgmi-signed.apk
